name: Build, test, and package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DeskNote.slnx

      - name: Verify formatting
        run: dotnet format DeskNote.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build DeskNote.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DeskNote.slnx --configuration Release --no-restore

      - name: Verify 10,000-note performance targets
        run: >-
          dotnet run --project tests/DeskNote.Benchmarks/DeskNote.Benchmarks.csproj
          --configuration Release --no-build -- 10000

      - name: Publish and smoke-test win-x64 package
        shell: pwsh
        run: ./scripts/publish-win-x64.ps1 -NoRestore

      - name: Upload win-x64 package
        uses: actions/upload-artifact@v4
        with:
          name: DeskNote-win-x64
          path: dist/DeskNote-win-x64.zip
          if-no-files-found: error
